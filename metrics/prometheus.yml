global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'hyperbuddy'
    metrics_path: '/~hyperbuddy@1.0/metrics'
    static_configs:
      - targets: ['host.docker.internal:8734']
        labels:
          node: 'local'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']