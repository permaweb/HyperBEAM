services:

  # ── HyperBEAM node ─────────────────────────────────────────────────────────
  hyperbeam:
    build:
      context: .
      dockerfile: Dockerfile
    image: hyperbeam-edge:latest
    container_name: hyperbeam
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      - HB_CONFIG=config.json
    volumes:
      - ./cache-mainnet:/opt/_build/genesis_wasm/rel/hb/cache-mainnet
      - ./config.json:/opt/_build/genesis_wasm/rel/hb/config.json:ro
      - ./hyperbeam-key.json:/opt/_build/genesis_wasm/rel/hb/hyperbeam-key.json:ro
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ── Loki (log storage) ─────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # ── Promtail (log shipper) ──────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring

  # ── Grafana (dashboards) ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-hyperbeam}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://hyperbeam.permaweb.black/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - monitoring

volumes:
  loki-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
