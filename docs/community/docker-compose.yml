services:
  hyperbeam:
    build: .
    ports:
      - "8001:8001"
    environment:
      - ARWEAVE_NODE=${ARWEAVE_NODE:-http://localhost:1984}
      - HB_PORT=${HB_PORT:-8001}
      - DATA_DIR=/data/rolling
    volumes:
      - hyperbeam-data:/data
      - type: bind
        source: ../../wallets/operator.json
        target: /app/wallet.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../wallets/operator.json
        target: /app/hb/hyperbeam-key.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  hyperbeam-data:
