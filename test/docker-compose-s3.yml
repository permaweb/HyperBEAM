volumes:
  minio_data:
    driver: local

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ~/minio/data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"

  mc:
    image: quay.io/minio/minio
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc rb --force minio/hb-s3;
      /usr/bin/mc mb --quiet minio/hb-s3;
      /usr/bin/mc policy set public minio/hb-s3;
      "